# 2026-11-22 00:00 (한국 시간)에 초대장 사이트를 내립니다.
# 사이트 파일을 모두 지워서 링크를 누르면 404(Page not found)가 뜨게 합니다.
# GitHub 예약 실행은 몇 분 늦을 수 있어서 00:00 / 00:15 / 00:30 / 00:45 에 다시 시도합니다.
# 수동 실행(Run workflow)은 사이트를 지우지 않고 쓰기 권한만 시험합니다.
name: 초대장 내리기 (2026-11-22 00:00 KST)

on:
  schedule:
    - cron: '0,15,30,45 15 21 11 *'   # UTC 11/21 15:xx = 한국 11/22 00:xx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 파일 삭제
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            git checkout -b takedown-test
            git commit --allow-empty -m "takedown 권한 테스트"
            git push origin takedown-test
            git push origin --delete takedown-test
            echo "테스트 성공: 쓰기 권한 있음 (사이트는 그대로)"
            exit 0
          fi

          NOW=$(TZ=Asia/Seoul date +%Y%m%d%H%M)
          echo "현재 한국 시간: $NOW"
          if [ "$NOW" -lt 202611220000 ] || [ "$NOW" -gt 202611222359 ]; then
            echo "예약된 날짜가 아니라서 건너뜀"
            exit 0
          fi

          if [ -z "$(git ls-files | grep -v '^\.github/' | grep -vx '\.nojekyll')" ]; then
            echo "이미 내려간 상태"
            exit 0
          fi

          # 예약 작업 파일(.github)은 GITHUB_TOKEN으로 지울 수 없어서 남겨 둡니다.
          git ls-files | grep -v '^\.github/' | xargs git rm -q
          touch .nojekyll
          git add .nojekyll
          git commit -m "초대장 내림 (2026-11-22 00:00 KST)"
          git push
